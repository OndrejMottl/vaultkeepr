home:
  title: "vegvault: Providing the interface to access the VegVault database"
  description: "An R package for extracting and analyzing data from the VegVault database"

url: https://hope-uib-bio.github.io/vaultkeepr/
template:
  bootstrap: 5
  bslib:
    # Only neutral Bootstrap variables that are safe to set globally.
    # Body background + link colours are set in extra.scss directly
    # (like VegVault does), because bslib 'bg' cascades into dozens of
    # Bootstrap-derived values and non-neutral colours look wrong there.
    # bslib requires bg when fg is specified; use white so Bootstrap
    # internals stay neutral - we override the actual body bg in SCSS.
    bg: "#ffffff"
    fg: "#242531"
    primary: "#52758f"
    secondary: "#5f634f"
    border-radius: "0.375rem"
  includes:
    in_header: |
      <link rel="preconnect" href="https://fonts.googleapis.com">
      <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Press+Start+2P&display=swap" rel="stylesheet">
  opengraph:
    image:
      src: man/figures/vaultkeeper_logo.png
      alt: "VegVault logo"
    twitter:
      creator: "@OndrejMottl"
      card: summary_large_image
navbar:
  structure:
    right: [search, github]
  component:
    twitter:
      icon: fa-twitter
      href: http://twitter.com/OndrejMottl
      aria-label: Twitter

reference:
  - title: Connect
    desc: Open a connection to the VegVault database and explore its contents.
    contents:
      - open_vault
      - explore_vault

  - title: Get data
    desc: >
      Retrieve data from the vault. Chain these after `open_vault()` to
      build a query plan.

  - subtitle: Datasets
    contents:
      - get_datasets
      - get_common_dataset_type

  - subtitle: Samples
    contents:
      - get_samples
      - get_age_uncertainty

  - subtitle: Taxa
    contents:
      - get_taxa

  - subtitle: Traits
    contents:
      - get_traits

  - subtitle: Abiotic data
    contents:
      - get_abiotic_data

  - title: Filter
    desc: >
      Narrow the selection of datasets, samples, taxa, traits, and abiotic
      variables before extracting data.

  - subtitle: Datasets
    contents:
      - select_dataset_by_type
      - select_dataset_by_geo

  - subtitle: Samples
    contents:
      - select_samples_by_age

  - subtitle: Taxa
    contents:
      - select_taxa_by_id
      - select_taxa_by_name

  - subtitle: Abiotic variables
    contents:
      - select_abiotic_var_by_id
      - select_abiotic_var_by_name

  - subtitle: Traits
    contents:
      - select_traits_by_domain_name

  - title: Extract & process
    desc: Extract and post-process the selected data.
    contents:
      - extract_data
      - pack_data
      - classify_taxa
      - get_classification_table

  - title: References & citations
    desc: Retrieve data citations for the selected data.
    contents:
      - get_references

  - title: Utilities
    desc: Helper functions used in advanced workflows.
    contents:
      - get_taxon_names
      - get_readable_column_names
      - stop_quietly

articles:
  - title: "Usage Examples"
    navbar: "Usage Examples"
    contents:
      - a01_taxa_distribution
      - a02_vegetation_climate
      - a03_functional_traits
      - a04_extract_data
      - a05_references
      - a06_palaeo_uncertainty
      - a07_classification_workflow
